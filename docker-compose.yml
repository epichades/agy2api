services:
  agy2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agy2api-local:reviewed
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file:
      - .env
    environment:
      API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD in a private .env file}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Set PANEL_PASSWORD in a private .env file}
      HOST: "0.0.0.0"
      PORT: "7861"
      WORKERS: "1"
      CREDENTIALS_DIR: /app/creds
      LOG_FILE: ""
    ports:
      - "127.0.0.1:${PORT:-7861}:7861"
    volumes:
      - credentials:/app/creds
      - request_logs:/app/data/request_logs
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  credentials:
  request_logs:
